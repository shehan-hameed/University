<!DOCTYPE html>
<html lang="en">
<head>
    <title>Activity 04</title>
</head>
<body>
    <h3>Check your browser console (F12) for function outputs!</h3>

    <script>
        // 1. Defining a function that prints a greeting message
        function greetUser(name) {
            console.log("Hello, " + name + "!");
        }

        // 2. Calling the function with an input value
        greetUser("Shehan");

        // 3. Function with a return value
        function addNumbers(a, b) {
            return a + b;
        }

        // 4. Executing and printing the return value
        let result = addNumbers(10, 20);
        console.log("Result of addNumbers(10, 20): " + result);
    </script>
</body>
</html>
