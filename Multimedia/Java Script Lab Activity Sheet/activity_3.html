<!DOCTYPE html>
<html lang="en">
<head>
    <title>Activity 03</title>
</head>
<body>
    <h2>Student Information</h2>
    
    <p id="name"></p>
    <p id="age"></p>
    
    <button onclick="showDetails()">Show Details</button>

    <script>
        function showDetails() {
            // Using innerHTML to insert data into the paragraphs
            document.getElementById("name").innerHTML = "Name: Shehan";
            document.getElementById("age").innerHTML = "Age: 21";
        }
    </script>
</body>
</html>
